name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (lint, import, rules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install deps
        run: pip install -r backend/requirements.txt
      - name: Compile-check all Python sources
        run: python -m compileall -q backend
      - name: Import smoke test (FastAPI app loads, routes register)
        working-directory: backend
        run: |
          python - <<'PY'
          from app import main
          routes = [r.path for r in main.app.routes if hasattr(r, "path")]
          expected = {"/health", "/admin/seed", "/submissions", "/qa", "/qa/history"}
          missing = expected - set(routes)
          assert not missing, f"Missing routes: {missing}"
          print(f"OK — {len(routes)} routes registered")
          PY
      - name: Deterministic rule-engine checks
        working-directory: backend
        run: |
          python - <<'PY'
          from app.services.deterministic import run_rules
          from app.schemas import ExtractedReceipt

          # Solo travel + alcohol must REJECT and cite TEP-003 §3.1
          r = ExtractedReceipt(
              merchant="Franklin", category="meal_dinner", total=80, subtotal=62,
              alcohol_present=True, alcohol_amount=18, attendees=["Alex"],
              city="Austin", extraction_confidence=0.9,
          )
          codes = {(f.rule_id, f.severity) for f in run_rules(r, "Solo trip to visit prospect", 2, 5)}
          assert ("alcohol_solo_travel", "reject") in codes, codes

          # Over-cap dinner must FLAG meal_cap_exceeded
          r2 = ExtractedReceipt(
              merchant="Alinea", category="meal_dinner", total=210,
              city="Chicago", extraction_confidence=0.9, attendees=["A", "B"],
          )
          codes2 = {(f.rule_id, f.severity) for f in run_rules(r2, "Client dinner", 1, 5)}
          assert ("meal_cap_exceeded", "flag") in codes2, codes2

          print("OK — deterministic engine produces expected verdicts")
          PY

  frontend:
    name: Frontend (typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Build
        env:
          NEXT_PUBLIC_API_BASE: http://localhost:8000
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

  docker:
    name: Docker build + compose smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the full stack (deterministic mode, no API key)
        run: docker compose -f docker-compose.prod.yml up -d --build
      - name: Wait for backend /health
        run: |
          for i in {1..40}; do
            if curl -fsS http://localhost:8000/health; then echo; echo OK; exit 0; fi
            sleep 3
          done
          docker compose -f docker-compose.prod.yml logs backend
          exit 1
      - name: Wait for frontend
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:3000/ >/dev/null; then echo OK; exit 0; fi
            sleep 3
          done
          docker compose -f docker-compose.prod.yml logs frontend
          exit 1
      - name: Seed and check submissions endpoint
        run: |
          curl -fsS -X POST http://localhost:8000/admin/seed
          curl -fsS http://localhost:8000/employees | head -c 400; echo
      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.prod.yml down -v
