services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: northwind
      POSTGRES_PASSWORD: northwind
      POSTGRES_DB: northwind
    ports:
      - "5432:5432"
    volumes:
      - northwind_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U northwind"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  northwind_pgdata:
